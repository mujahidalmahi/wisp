name: Basic CI

on:
  push:
    branches: [main, server, client, ai-integration, testing, docs]
  pull_request:
    branches: [main, server, client, ai-integration, testing, docs]

jobs:
  validate:
    name: Run Wisp Test Suites & Verify Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Monorepo Typecheck
        run: npm run typecheck

      - name: Build Backend
        run: npm --workspace=backend run build

      - name: Run Backend Test Suite
        run: npm --workspace=backend run test

      - name: Run Multi-Layer Test Suite (testing/)
        run: npm test

      - name: Run Security Regression Suite
        run: npm run security:test

      - name: Run Security Audit & Penetration Suite
        run: npm run security:audit
