name: Basic CI

on:
  push:
    branches: [main, server, client, ai-integration, docs]
  pull_request:
    branches: [main, server, client, ai-integration, docs]

jobs:
  validate:
    name: Basic Repository & Workspace Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Standalone AI Engine Tests (if present)
        run: |
          if [ -f "ai-engine/src/engine.test.ts" ]; then
            node --test ai-engine/src/engine.test.ts
          fi

      - name: Verify Core Documentation Exists
        run: |
          test -f README.md
          test -f docs/PROPOSAL.md
          test -f docs/ARCHITECTURE.md
          test -f docs/FRICTION_LOG.md
