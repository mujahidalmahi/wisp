name: Basic CI

on:
  push:
    branches: [main, server, client, ai-integration, docs]
  pull_request:
    branches: [main, server, client, ai-integration, docs]

jobs:
  validate:
    name: Run Wisp Test Suites & Verify Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Multi-Layer Test Suite (testing/)
        run: node --test "testing/**/*.test.ts"
